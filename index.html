<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAMOFINANCE</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1220, #05070d);
      color: white;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 52px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    p {
      max-width: 700px;
      opacity: 0.8;
      line-height: 1.6;
      font-size: 18px;
    }

    .btn {
      margin-top: 25px;
      padding: 12px 24px;
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>RAMOFINANCE</h1>

    <p>
      Trading is not gambling — but without structure, risk control, and discipline, it becomes one.<br><br>
      We build systematic investment approaches designed to manage risk and execute with precision.
    </p>

    <a class="btn" href="#">Join Waitlist</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAMOFINANCE | Systematic Investment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
      font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
      color: #eef5ff;
      line-height: 1.5;
      transition: all 0.2s ease;
    }

    @keyframes glowShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* glass header */
    .glass-header {
      backdrop-filter: blur(14px);
      background: rgba(15, 25, 45, 0.55);
      border-radius: 2rem;
      padding: 0.8rem 2rem;
      margin-bottom: 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      border: 1px solid rgba(72, 120, 255, 0.25);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-placeholder {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2b5cff, #7c3aed);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      box-shadow: 0 0 12px rgba(43,92,255,0.4);
    }

    .brand {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(120deg, #ffffff, #94a3ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lang-switch {
      background: rgba(255,255,255,0.08);
      border: 1px solid #3b82f6;
      padding: 6px 18px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: 0.2s;
      color: #bbd7ff;
    }
    .lang-switch:hover {
      background: #1e40af;
      color: white;
    }

    .tg-btn-mini {
      background: rgba(0, 136, 204, 0.2);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid #2b6eff;
      color: #aac9ff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
      margin-left: 12px;
    }
    .tg-btn-mini:hover {
      background: #1d4ed8;
      color: white;
      border-color: white;
    }

    .hero-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin: 3rem 0 5rem;
      align-items: center;
    }

    @media (max-width: 800px) {
      .hero-section {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }

    .badge-risk {
      background: #ff3b3010;
      border-left: 4px solid #ff5e4a;
      padding: 0.6rem 1.2rem;
      border-radius: 28px;
      display: inline-block;
      font-size: 0.8rem;
      color: #ffb4a8;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(135deg, #FFF, #bfd6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }

    .highlight {
      color: #3b82f6;
      text-shadow: 0 0 6px #1e40af40;
    }

    .desc {
      font-size: 1.1rem;
      opacity: 0.85;
      margin: 1.2rem 0;
    }

    .stats-box {
      background: rgba(10, 20, 35, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 32px;
      padding: 2rem;
      border: 1px solid rgba(59,130,246,0.3);
    }

    .risk-list, .benefit-list {
      list-style: none;
      margin-top: 1rem;
    }

    .risk-list li, .benefit-list li {
      margin: 0.9rem 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .risk-list li::before {
      content: "⚠️";
      font-size: 1.2rem;
    }

    .benefit-list li::before {
      content: "✓";
      background: #1e3a8a;
      width: 24px;
      height: 24px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #4ade80;
    }

    .btn-group {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(95deg, #1e40af, #3b82f6);
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: bold;
      border: none;
      color: white;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s;
      box-shadow: 0 8px 18px -6px #1e3a8a;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      background: linear-gradient(95deg, #2563eb, #4f46e5);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #3b82f6;
      padding: 12px 28px;
      border-radius: 40px;
      color: #bbd7ff;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn-outline:hover {
      background: #1e3a8a30;
      border-color: #90cdf4;
      color: white;
    }

    .quote-card {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 2rem;
      padding: 2rem;
      margin: 3rem 0;
      text-align: center;
      border-top: 2px solid #3b82f6;
      font-style: italic;
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.6;
      border-top: 1px solid #1e293b;
      padding-top: 2rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="glass-header">
    <div class="logo-area">
      <div class="logo-placeholder">R</div>
      <span class="brand">RAMOFINANCE</span>
    </div>
    <div>
      <button class="lang-switch" id="langToggleBtn">🇮🇷 فارسی</button>
      <a href="https://t.me/ramofinancebot" target="_blank" class="tg-btn-mini">🤖 Telegram Bot</a>
    </div>
  </div>

  <!-- محتوای داینامیک که با js تغییر می‌کنه -->
  <div id="dynamicContent">
    <!-- محتوای انگلیسی پیش‌فرض -->
  </div>

  <footer id="footer">
    <p>© 2025 RAMOFINANCE — data-driven, risk-first.</p>
  </footer>
</div>

<script>
  // لینک ثابت بات
  const BOT_LINK = "https://t.me/ramofinancebot";
  
  // آبجکت متن‌ها
  const texts = {
    en: {
      badge: "⚠️ Stock Market Reality",
      title: "Trading is not gambling — ",
      titleHighlight: "but without a system, it becomes one.",
      desc: "Many retail traders lose due to emotions, lack of risk management, and inconsistent strategy. RAMOFINANCE builds systematic approaches to remove psychological pitfalls.",
      riskTitle: "📉 Common Risks of Solo Trading:",
      risks: [
        "No stop-loss & poor capital management",
        "Emotional decisions based on news/FOMO",
        "Negative long-term expectancy",
        "Mental burnout & revenge trading"
      ],
      solutionTitle: "✔ RAMOFINANCE Solution",
      benefits: [
        "Automated & semi-automated trading systems",
        "Dynamic risk management tailored to your capital",
        "Full transparency & periodic performance reports",
        "Strategy team (same as our Telegram bot team)"
      ],
      quote: "«We believe that sustainable wealth in stock markets comes from process, not luck. Our platform removes the destructive psychology of the trader.»",
      founder: "— RAMOFINANCE Founder",
      waitlist: "📋 Join Waitlist",
      telegramBtn: "📲 Telegram Bot",
      footer: "© 2025 RAMOFINANCE — data-driven, risk-first.",
      contact: "Contact via Bot"
    },
    fa: {
      badge: "⚠️ واقعیت بازار سهام",
      title: "ترید شخصی قمار نیست — ",
      titleHighlight: "اما بدون سیستم، همین طور می‌شود.",
      desc: "بسیاری از تریدرهای خرد به دلیل هیجانات، نبود مدیریت ریسک و استراتژی نامنظم ضرر می‌کنند. رمـو فایننس رویکردهای سیستماتیک برای حذف تله‌های روانی می‌سازد.",
      riskTitle: "📉 خطرات رایج ترید انفرادی:",
      risks: [
        "نداشتن حد ضرر و مدیریت سرمایه ضعیف",
        "تصمیمات احساسی بر اساس اخبار و FOMO",
        "چشم‌انداز منفی بلندمدت",
        "فرسودگی ذهنی و انتقام‌گیری در معاملات"
      ],
      solutionTitle: "✔ راه‌حل رمـو فایننس",
      benefits: [
        "سیستم‌های معاملاتی خودکار و نیمه‌خودکار",
        "مدیریت ریسک پویا متناسب با سرمایه شما",
        "شفافیت کامل و گزارش‌های دوره‌ای عملکرد",
        "تیم استراتژی (همان تیم پشت بات تلگرام)"
      ],
      quote: "«ما باور داریم ثروت‌سازی پایدار در بازار سهام، حاصل فرآیند است نه شانس. پلتفرم ما روان‌شناسی مخرب تریدر را حذف می‌کند.»",
      founder: "— بنیانگذار رمـو فایننس",
      waitlist: "📋 عضویت در لیست انتظار",
      telegramBtn: "📲 بات تلگرام",
      footer: "© ۲۰۲۵ رمـو فایننس — داده‌محور، ریسک اول",
      contact: "ارتباط از طریق بات"
    }
  };

  let currentLang = "en";

  function renderPage() {
    const t = texts[currentLang];
    const container = document.getElementById("dynamicContent");
    
    // ساختار HTML کامل
    const html = `
      <div class="hero-section">
        <div>
          <div class="badge-risk">${t.badge}</div>
          <h1>${t.title}<span class="highlight">${t.titleHighlight}</span></h1>
          <p class="desc">${t.desc}</p>
          <div class="stats-box">
            <div style="font-weight:bold; margin-bottom:12px;">${t.riskTitle}</div>
            <ul class="risk-list">
              ${t.risks.map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>
        </div>

        <div>
          <div class="stats-box" style="border-left: 3px solid #22c55e;">
            <div style="font-weight:bold; margin-bottom:12px; color:#86efac;">${t.solutionTitle}</div>
            <ul class="benefit-list">
              ${t.benefits.map(b => `<li>${b}</li>`).join('')}
            </ul>
            <div class="btn-group">
              <a class="btn-primary" href="#" id="waitlistBtnDynamic">${t.waitlist}</a>
              <a class="btn-outline" href="${BOT_LINK}" target="_blank" id="telegramBtnDynamic">${t.telegramBtn}</a>
            </div>
          </div>
        </div>
      </div>

      <div class="quote-card">
        <p style="font-size:1.25rem;">${t.quote}</p>
        <p style="margin-top:1rem;">${t.founder}</p>
      </div>

      <div style="text-align:center; margin-bottom: 2rem;">
        <a href="${BOT_LINK}" target="_blank" style="background:#0f172a; padding:10px 28px; border-radius:40px; text-decoration:none; color:#bbf0ff; border:1px solid #3b82f6;">🤖 ${t.contact} →</a>
      </div>
    `;
    
    container.innerHTML = html;
    document.getElementById("footer").innerHTML = `<p>${t.footer}</p>`;
    
    // اضافه کردن event به دکمه waitlist (اگر نیاز به اکشن خاصی دارید)
    const waitlistBtn = document.getElementById("waitlistBtnDynamic");
    if(waitlistBtn) {
      waitlistBtn.addEventListener("click", (e) => {
        e.preventDefault();
        alert(currentLang === "en" ? "Waitlist feature coming soon. Join via Telegram bot!" : "ویژگی لیست انتظار به زودی. از طریق بات تلگرام عضو شوید!");
      });
    }
  }
  
  // تغییر زبان
  function toggleLanguage() {
    currentLang = currentLang === "en" ? "fa" : "en";
    const toggleBtn = document.getElementById("langToggleBtn");
    if(currentLang === "fa") {
      toggleBtn.innerHTML = "🇬🇧 English";
      document.documentElement.lang = "fa";
      document.dir = "rtl";
      // تنظیم ریخت‌شناسی RTL برای فارسی
      document.body.style.direction = "rtl";
      document.querySelector(".container").style.direction = "rtl";
    } else {
      toggleBtn.innerHTML = "🇮🇷 فارسی";
      document.documentElement.lang = "en";
      document.dir = "ltr";
      document.body.style.direction = "ltr";
      document.querySelector(".container").style.direction = "ltr";
    }
    renderPage();
  }
  
  document.getElementById("langToggleBtn").addEventListener("click", toggleLanguage);
  
  // رندر اولیه
  renderPage();
</script>
</body>
</html>
